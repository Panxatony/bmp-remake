[sdl]
fullscreen=false
output=surface
windowresolution=original
# Maus nicht einfangen: der Zeiger bleibt frei, das Spiel folgt der Position (xrdp)
autolock=false
sensitivity=100
waitonerror=true
usescancodes=false
[dosbox]
machine=svga_s3
captures=capture
memsize=16
[render]
scaler=normal3x
[cpu]
core=auto
cycles=fixed 12000
[mixer]
nosound=true
[sblaster]
sbtype=none
[speaker]
pcspeaker=false
[autoexec]
@echo off
rem Arbeitskopie des Originals, relativ zu tools/dosbox (von dort wird DOSBox gestartet)
mount c ../../../bmp-work
c:
