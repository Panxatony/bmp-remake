# DOSBox-X zum Spielen und Beobachten (Debugger mit Alt+Pause oder Menü "Debug").
# Gleiche CPU-Einstellung wie bmp.conf, damit das Spiel gleich schnell läuft.
[sdl]
fullscreen=false
autolock=false
output=surface
showmenu=false

[dosbox]
machine=svga_s3
memsize=16

[render]
scaler=normal3x
aspect=false

[cpu]
core=normal
cputype=386
cycles=fixed 12000

[mixer]
nosound=true

[sblaster]
sbtype=none

[speaker]
pcspeaker=false

[autoexec]
@echo off
rem Arbeitskopie des Originals, relativ zu tools/dosbox (von dort wird DOSBox gestartet)
mount c ../../../bmp-work
c:
