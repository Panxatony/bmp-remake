# Zum Spielen des Originals (Maus wird gefangen, Ton an). Aufruf aus diesem Ordner:
#   dosbox -conf bmp-spielen.conf -c bmmain
# Die Maus fängt DOSBox beim ersten Klick ins Fenster, STRG+F10 gibt sie wieder frei.
[sdl]
fullscreen=false
output=surface
autolock=false
sensitivity=100
waitonerror=true

[dosbox]
machine=svga_s3
captures=capture
memsize=16

[render]
scaler=normal2x

[cpu]
core=auto
cycles=fixed 12000

[mixer]
nosound=false
rate=44100

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1

[speaker]
pcspeaker=true

[autoexec]
@echo off
rem Arbeitskopie des Originals, relativ zu tools/dosbox (von dort wird DOSBox gestartet)
mount c ../../../bmp-work
c:
